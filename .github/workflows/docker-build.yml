name: Build and Test Docker Image

# Triggers: Jab bhi 'main' branch par push ya pull request aaye
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: GitHub Repo se code checkout karna
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Docker Image Build karna
      - name: Build Docker Image
        run: |
          docker build -t my-app:latest .

      # Step 3: Container Run karke Verify karna
      - name: Test Docker Container
        run: |
          docker run -d -p 8080:80 --name test-container my-app:latest
          sleep 3
          curl -f http://localhost:8080 || exit 1

      # Step 4: Cleanup
      - name: Stop Container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true
